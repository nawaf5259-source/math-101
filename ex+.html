<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرياضيات 101 - التمارين الإثرائية</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1e1b4b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="رياض 101">
    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <!-- MathJax (SVG output keeps matrix brackets unbroken) -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            },
            svg: { fontCache: 'global', mtextInheritFont: true },
            startup: { typeset: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-svg.js"></script>
</head>

<body>

    <!-- Navigation -->
    <div id="navbar-container"></div>

    <!-- Hero Section -->
    <header class="hero">
        <div class="container">
            <h1>التمارين الإثرائية</h1>
            <p>10 تمارين بحلول مفصّلة لكل درس، مرتّبة بعناوين فيديوهات الشرح</p>
        </div>
    </header>

    <main class="container video-library">
        <div id="enrich-app" class="en-app" aria-live="polite"></div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="main.js" defer></script>
    <script src="enrichment-app.js" defer></script>
</body>

</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 101 Logo Preview</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo-container {
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }

        h1 {
            color: #2c3e50;
            margin-top: 20px;
        }

        p {
            color: #7f8c8d;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo-container">
            <!-- Math 101 Unified Logo -->
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#2980b9;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
                    </linearGradient>
                </defs>

                <!-- 1. Matrices: Brackets -->
                <path d="M 35,30 L 15,30 L 15,170 L 35,170" fill="none" stroke="url(#mainGrad)" stroke-width="8"
                    stroke-linecap="round" />
                <path d="M 165,30 L 185,30 L 185,170 L 165,170" fill="none" stroke="url(#mainGrad)" stroke-width="8"
                    stroke-linecap="round" />

                <!-- 2. Sets: Venn Diagram (Background) -->
                <g opacity="0.1">
                    <circle cx="80" cy="100" r="45" fill="#2980b9" />
                    <circle cx="120" cy="100" r="45" fill="#16a085" />
                </g>

                <!-- 3. Geometry: 3D Cube (Center) -->
                <!-- Shifted slightly to center-top to make room -->
                <g transform="translate(75, 40)" stroke="#2c3e50" stroke-width="2" fill="none">
                    <rect x="0" y="20" width="50" height="50" fill="rgba(255,255,255,0.8)" />
                    <path d="M 0,20 L 15,0 L 65,0 L 50,20" />
                    <path d="M 50,20 L 65,0 L 65,50 L 50,70" />
                    <path d="M 0,70 L 15,50 L 65,50" stroke-dasharray="3,2" opacity="0.5" />
                    <path d="M 15,50 L 15,0" stroke-dasharray="3,2" opacity="0.5" />
                </g>

                <!-- 4. Operations: Right Side -->
                <g font-family="sans-serif" font-weight="bold" font-size="16" fill="#7f8c8d">
                    <text x="140" y="60">+</text>
                    <text x="160" y="75">−</text>
                    <text x="140" y="90">×</text>
                    <text x="160" y="105">÷</text>
                </g>

                <!-- 5. Linear System: Left Side (Shifted Left -20) -->
                <!-- Curly brace path -->
                <path d="M 25,55 Q 20,75 25,95" fill="none" stroke="#2c3e50" stroke-width="1.5" />
                <path d="M 25,75 L 22,75" fill="none" stroke="#2c3e50" stroke-width="1.5" />
                <!-- System equations -->
                <g font-family="serif" font-size="12" fill="#2c3e50">
                    <text x="30" y="70">x+y=5</text>
                    <text x="30" y="90">x-y=1</text>
                </g>

                <!-- 6. Numbers: R and Q inside Venn circles -->
                <text x="60" y="130" font-family="serif" font-weight="bold" font-size="22" fill="#2c3e50">ℝ</text>
                <text x="130" y="130" font-family="serif" font-weight="bold" font-size="22" fill="#2c3e50">ℚ</text>

                <!-- 7. Polynomials: Quadratic Trinomial at bottom -->
                <text x="100" y="160" font-family="serif" font-style="italic" font-size="16" fill="#e74c3c"
                    text-anchor="middle">ax² + bx + c</text>

            </svg>
        </div>
        <h1>Math 101</h1>
        <p>شعار الرياضيات الشامل (تحسين المواقع)</p>
    </div>

</body>

</html>
